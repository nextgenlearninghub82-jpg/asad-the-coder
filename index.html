<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asad-the-coder | Mood Jukebox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #050505; color: white; font-family: sans-serif; }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    .ui-layer { position: relative; z-index: 10; pointer-events: none; }
    .clickable { pointer-events: auto; }
    
    /* Animated floating text particles */
    .floating-word {
      position: absolute;
      color: rgba(255, 255, 255, 0.15);
      font-size: 1.2rem;
      font-weight: bold;
      pointer-events: none;
      white-space: nowrap;
      animation: floatUp 12s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      20% { opacity: 0.2; }
      80% { opacity: 0.2; }
      100% { transform: translateY(-10vh) rotate(15deg); opacity: 0; }
    }
  </style>
</head>
<body class="w-screen h-screen relative bg-gradient-to-br from-purple-950 via-black to-blue-950 transition-colors duration-1000">

  <!-- 3D Canvas Background -->
  <div id="canvas-container"></div>

  <!-- Watermark Text Layer -->
  <div id="watermark-layer" class="absolute inset-0 z-0 overflow-hidden pointer-events-none"></div>

  <!-- UI Overlay -->
  <div class="ui-layer flex flex-col justify-between h-full p-6">
    
    <!-- Header -->
    <header class="flex justify-between items-center">
      <div class="bg-black/50 backdrop-blur-md border border-white/10 px-4 py-2 rounded-full clickable">
        <h1 class="text-xs font-bold tracking-widest uppercase text-cyan-400">Asad-the-coder</h1>
      </div>
      <div class="flex space-x-2 bg-black/50 backdrop-blur-md p-1.5 rounded-full border border-white/10 clickable">
        <button onclick="changeVibe('#8b5cf6', 'from-purple-950 via-black to-blue-950')" class="px-3 py-1 rounded-full text-xs font-semibold hover:bg-white/20">Cyberpunk</button>
        <button onclick="changeVibe('#3b82f6', 'from-gray-950 via-blue-950 to-black')" class="px-3 py-1 rounded-full text-xs font-semibold hover:bg-white/20">Midnight Rain</button>
        <button onclick="changeVibe('#f43f5e', 'from-rose-950 via-purple-950 to-black')" class="px-3 py-1 rounded-full text-xs font-semibold hover:bg-white/20">Retro Sunset</button>
      </div>
    </header>

    <!-- Center Surprise Button -->
    <div class="flex justify-center">
      <button onclick="openNote()" class="clickable px-6 py-3 rounded-full bg-white/10 backdrop-blur-md border border-white/20 hover:border-white/50 text-white font-medium shadow-2xl transition-all hover:scale-105 active:scale-95">
        ✨ Open Special Note
      </button>
    </div>

    <!-- Music Player Footer -->
    <footer class="flex justify-between items-end">
      <div class="bg-black/60 backdrop-blur-lg border border-white/10 p-3 rounded-2xl w-80 clickable">
        <p class="text-xs font-semibold mb-2 text-cyan-400">🎵 Vibe Playlist</p>
        <iframe src="https://open.spotify.com/embed/playlist/37i9dQZF1DX8Ueb1233S12?utm_source=generator&theme=0" width="100%" height="80" frameBorder="0" class="rounded-xl" allow="autoplay"></iframe>
      </div>
      <div class="text-xs text-gray-400 bg-black/40 backdrop-blur-md px-3 py-2 rounded-xl border border-white/5">
        Built by <span class="text-cyan-400 font-bold">Asad-the-coder</span>
      </div>
    </footer>
  </div>

  <!-- Surprise Modal -->
  <div id="modal" class="hidden absolute inset-0 z-30 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md">
    <div class="bg-gray-900 border border-white/20 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl">
      <h3 class="text-xl font-bold mb-2">💖 A Secret Note</h3>
      <p class="text-sm text-gray-300 mb-6 leading-relaxed">
        "Every line of code and every visual detail here was crafted to surprise you and bring a smile to your face!"
      </p>
      <button onclick="closeNote()" class="w-full py-2.5 rounded-xl bg-white text-black font-semibold hover:bg-gray-200">Close</button>
    </div>
  </div>

  <script>
    // 1. Floating Words Generator
    const words = ["debonair boy", "mr asad", "hacker", "coder", "builder", "your love", "Asad-the-coder"];
    const layer = document.getElementById('watermark-layer');
    
    function createWord() {
      const el = document.createElement('div');
      el.className = 'floating-word';
      el.innerText = words[Math.floor(Math.random() * words.length)];
      el.style.left = Math.random() * 90 + 'vw';
      el.style.animationDuration = (8 + Math.random() * 6) + 's';
      layer.appendChild(el);
      setTimeout(() => el.remove(), 14000);
    }
    setInterval(createWord, 1200);

    // 2. Three.js 3D Sphere Scene
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const geometry = new THREE.IcosahedronGeometry(2, 2);
    const material = new THREE.MeshStandardMaterial({ color: 0x8b5cf6, wireframe: true });
    const sphere = new THREE.Mesh(geometry, material);
    scene.add(sphere);

    const light = new THREE.PointLight(0xffffff, 1, 100);
    light.position.set(10, 10, 10);
    scene.add(light);
    camera.position.z = 5;

    function animate() {
      requestAnimationFrame(animate);
      sphere.rotation.x += 0.005;
      sphere.rotation.y += 0.008;
      renderer.render(scene, camera);
    }
    animate();

    // 3. Helper Functions
    function changeVibe(colorHex, bgClasses) {
      material.color.setHex(colorHex.replace('#', '0x'));
      document.body.className = `w-screen h-screen relative bg-gradient-to-br ${bgClasses} transition-colors duration-1000`;
    }

    function openNote() {
      document.getElementById('modal').classList.remove('hidden');
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }

    function closeNote() {
      document.getElementById('modal').classList.add('hidden');
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
